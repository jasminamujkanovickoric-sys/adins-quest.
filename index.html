<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>ADIN'S QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef5ff;font:15px system-ui,Arial}.app{max-width:560px;margin:auto;padding:18px 14px 60px}header,.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:4px 0;font-size:27px}h2{font-size:19px;margin:12px 0}.muted{color:#a7bad6}.small{font-size:12px}.panel{background:#1c2a42;border:1px solid #31435e;border-radius:17px;padding:15px;margin:12px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#1c2a42;padding:14px;border-radius:14px}.big{font-size:24px;font-weight:800}.gold{color:#f4cb75}.green{color:#79e5b0}.bar{height:10px;border-radius:20px;background:#3c4c65;overflow:hidden;margin:10px 0}.bar span{display:block;background:#7bc5ff;height:100%}nav{display:flex;gap:7px;overflow:auto;padding:9px 0}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #4b6282;padding:10px;color:white;background:#263955}button{cursor:pointer}button.primary{background:#2979ca;border-color:#2979ca}button.active{background:#376caa}button:disabled{opacity:.4;cursor:not-allowed}nav button{white-space:nowrap}.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #32435d}.task:last-child{border:0}.task input{width:21px;height:21px;accent-color:#53dca4;flex-shrink:0}.task main{flex:1;min-width:0}.task small{display:block;color:#a7bad6;margin-top:4px}.field{display:grid;gap:5px;margin:12px 0}.field input,.field textarea,.field select{width:100%}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}.notice{background:#283a52;border-left:3px solid #f4cb75;padding:12px;border-radius:8px}.hidden{display:none}.pill{display:inline-block;padding:5px 8px;background:#31435d;border-radius:20px;font-size:12px}a{color:#a8d5ff}.danger{color:#ffb2b2}hr{border:0;border-top:1px solid #34445e}label{font-size:14px}</style></head><body><div class="app"><header><div><div class="muted small">SEZONA 01 · VII-1</div><h1>🎮 ADIN'S QUEST</h1></div><button id="role">👤 Adin</button></header><section class="panel"><div class="flex"><div><div class="muted small" id="level">LEVEL 1</div><h2 id="rank">Rookie</h2></div><span style="font-size:30px">🏆</span></div><div class="bar"><span id="xpbar"></span></div><div class="flex small"><span id="xptotal">0 XP</span><span id="xpnext">100 XP do nivoa</span></div></section><div class="stats"><div class="stat"><div class="gold">⚡ XP</div><div class="big" id="xp">0</div></div><div class="stat"><div class="green">💰 Štednja</div><div class="big" id="cash">0 KM</div></div></div><nav id="tabs"><button data-tab="misije" class="active">Misije</button><button data-tab="skola">Škola</button><button data-tab="provjere">Provjere</button><button data-tab="trofeji">Trofeji</button><button data-tab="novac">Novac</button></nav><div id="content"></div><p class="muted small">Probna lokalna verzija: podaci se čuvaju u ovom pregledniku na ovom uređaju. Nema sinhronizacije između telefona ni automatskih push obavijesti. Za roditeljski pristup trenutno nema sigurnosne prijave.</p></div><script>
const K='adins-quest-v1',base='2026-11-02',exams=[['2026-11-09','Matematika'],['2026-11-13','Fizika'],['2026-11-20','Bosanski jezik'],['2026-11-27','Njemački jezik'],['2026-12-09','Biologija'],['2026-12-11','Njemački jezik'],['2026-12-14','Matematika'],['2026-12-15','Engleski jezik'],['2026-12-21','Bosanski jezik']];
const schedules={prva:[['Muzička kultura','Tjelesni odgoj','Matematika','Njemački jezik','Bosanski jezik'],['Matematika','Informatika','Tehnička kultura','Engleski jezik','Geografija','Čas odjeljenske zajednice'],['Likovna kultura','Engleski jezik','Matematika','Biologija','Bosanski jezik','Historija'],['Građansko obrazovanje','Geografija','Historija','Engleski jezik','Bosanski jezik','Vjeronauka / DKR'],['Tjelesni odgoj','Fizika','Njemački jezik','Bosanski jezik','Biologija','Matematika']],druga:[['Bosanski jezik','Njemački jezik','Matematika','Tjelesni odgoj','Muzička kultura'],['Čas odjeljenske zajednice','Geografija','Engleski jezik','Informatika','Tehnička kultura','Matematika'],['Historija','Bosanski jezik','Biologija','Matematika','Engleski jezik','Likovna kultura'],['Vjeronauka / DKR','Bosanski jezik','Engleski jezik','Historija','Geografija','Građansko obrazovanje'],['Matematika','Biologija','Bosanski jezik','Njemački jezik','Fizika','Tjelesni odgoj']]};
const daily=[['Samostalno provjeri obaveze',15],['Uradi i provjeri zadaću',20],['Uči ili ponovi gradivo',20],['Pripremi torbu za sutra',10],['Pospremi sobu',10]];const subjects=['Matematika','Bosanski jezik','Engleski jezik','Njemački jezik','Fizika','Biologija','Historija','Geografija','Informatika','Tehnička kultura','Lektira','Ostalo'];let state;try{state=JSON.parse(localStorage.getItem(K))||{}}catch(e){state={}};state={daily:{},homework:[],exam:{},transactions:[],...state};let tab='misije',role=false,selected=localDate(new Date());function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function parse(s){return new Date(s+'T12:00:00')}function addDays(s,n){let d=parse(s);d.setDate(d.getDate()+n);return localDate(d)}function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000)}function shift(d){return Math.abs(Math.floor(daysBetween(base,d)/7))%2===0?'prva':'druga'}function shiftExact(d){return ((Math.floor(daysBetween(base,d)/7)%2)+2)%2===0?'prva':'druga'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(K,JSON.stringify(state));render()}function xp(){let a=Object.values(state.daily).reduce((n,arr)=>n+arr.reduce((m,i)=>m+daily[i][1],0),0);a+=state.homework.filter(x=>x.done).length*20;return a+Object.values(state.exam).reduce((n,arr)=>n+arr.length*15,0)}function money(){return state.transactions.reduce((a,t)=>a+t.amount,0)}function label(d){return parse(d).toLocaleDateString('bs-BA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function pending(){let today=localDate(new Date());return state.homework.filter(x=>!x.done&&daysBetween(today,x.due)<=7).sort((a,b)=>a.due.localeCompare(b.due))}function render(){let p=xp(),lv=Math.floor(p/100)+1;document.getElementById('level').textContent='LEVEL '+lv;document.getElementById('rank').textContent=lv===1?'Rookie':lv<4?'Explorer':'Champion';document.getElementById('xp').textContent=p;document.getElementById('cash').textContent=money().toFixed(2)+' KM';document.getElementById('xptotal').textContent=p+' XP ukupno';document.getElementById('xpnext').textContent=(100-p%100)+' XP do sljedećeg nivoa';document.getElementById('xpbar').style.width=p%100+'%';document.getElementById('role').textContent=role?'🛡️ Roditelj':'👤 Adin';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=document.getElementById('content');c.innerHTML=({misije:missions,skola:school,provjere:tests,trofeji:trophies,novac:wallet})[tab]();bind()}
function reminder(){let arr=pending();if(!arr.length)return '';let t=shiftExact(localDate(new Date()))==='prva'?'17:00':'10:00';return '<div class="notice"><b>🔔 Obaveze koje se približavaju</b><div class="small muted">Planirano vrijeme podsjetnika: '+t+' (podsjetnik se trenutno vidi samo kada otvoriš aplikaciju)</div>'+arr.map(x=>'<div style="margin-top:8px">'+esc(x.subject)+': '+esc(x.description)+' · rok '+esc(x.due)+' ('+(daysBetween(localDate(new Date()),x.due)<0?'rok prošao':daysBetween(localDate(new Date()),x.due)+' dana')+')</div>').join('')+'</div>'}
function missions(){let a=state.daily[selected]||[],future=selected>localDate(new Date()),weekend=[0,6].includes(parse(selected).getDay());return '<h2>📅 Dnevne misije</h2><div class="panel flex"><button id="prev">❮</button><div style="text-align:center"><b>'+esc(label(selected))+'</b><div class="muted small">'+(weekend?'Vikend':shiftExact(selected)==='prva'?'Prva smjena':'Druga smjena')+'</div></div><button id="next">❯</button></div>'+reminder()+'<div class="panel">'+daily.map((t,i)=>'<label class="task"><input type="checkbox" data-daily="'+i+'" '+(a.includes(i)?'checked':'')+' '+(future?'disabled':'')+'><main>'+esc(t[0])+'<small>+'+t[1]+' XP</small></main></label>').join('')+'</div>'+(future?'<p class="muted small">Buduće misije možeš pregledati, ali ih ne možeš unaprijed završiti.</p>':'')}
function school(){let dow=(parse(selected).getDay()+6)%7,ss=shiftExact(selected),s=dow<5?schedules[ss][dow]:[];return '<h2>📚 Škola</h2><div class="panel"><b>'+esc(label(selected))+' · '+(ss==='prva'?'Prva':'Druga')+' smjena</b><p class="muted small">Raspored časova (provjeriti redoslijed prema školskom rasporedu)</p>'+(s.length?s.map((x,i)=>'<div class="task">'+(i+1)+'. '+esc(x)+'</div>').join(''):'Nema redovne nastave.')+'</div><div class="panel"><h2>Dodaj obavezu</h2><form id="hwform"><div class="field"><label>Predmet / vrsta</label><select id="subject">'+subjects.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div><div class="field"><label>Šta treba uraditi?</label><textarea id="description" required placeholder="Npr. Pročitati lektiru i pripremiti analizu"></textarea></div><div class="field"><label>Rok</label><input id="due" type="date" required value="'+addDays(localDate(new Date()),7)+'"></div><button class="primary" type="submit">+ Dodaj obavezu</button></form><p class="small muted">Obaveza se prikazuje u podsjetnicima sedam dana prije roka i svaki dan do završetka.</p></div><h2>Moje obaveze</h2>'+(state.homework.length?state.homework.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(h=>'<div class="panel task"><input type="checkbox" data-hw="'+h.id+'" '+(h.done?'checked':'')+'><main><b>'+esc(h.subject)+'</b><div>'+esc(h.description)+'</div><small>Rok: '+esc(h.due)+(h.done?' · Završeno':'')+'</small></main><button data-delete="'+h.id+'" aria-label="Obriši">✕</button></div>').join(''):'<p class="muted">Još nema upisanih obaveza.</p>')}
function tests(){return '<h2>📝 Pismene provjere</h2><p class="muted small">VII-1 · Novembar i decembar 2026. Datume potvrdi prema školskom planu.</p>'+exams.map((e,i)=>'<div class="panel"><div class="flex"><b>'+esc(e[1])+'</b><span class="pill">'+e[0].split('-').reverse().join('.')+'</span></div>'+['Pregled gradiva','Učenje','Samoprovjera'].map((s,j)=>'<label class="task"><input type="checkbox" data-exam="'+i+'" data-step="'+j+'" '+((state.exam[i]||[]).includes(j)?'checked':'')+'><main>'+s+'<small>+15 XP</small></main></label>').join('')+'</div>').join('')}
function trophies(){let p=xp();return '<h2>🏆 Trofeji</h2>'+[['👣','Prvi korak',15],['📚','Vrijedni učenik',100],['⚡','XP Hunter',300],['🏆','Quest Champion',500]].map(t=>'<div class="panel flex"><span style="font-size:28px">'+t[0]+'</span><div style="flex:1"><b>'+t[1]+'</b><div class="muted small">'+t[2]+' XP potrebno</div></div><b>'+(p>=t[2]?'🔓':'🔒')+'</b></div>').join('')}
function wallet(){return '<h2>💰 Moj novčanik</h2><div class="panel"><div class="big green">'+money().toFixed(2)+' KM</div><p>Cilj štednje: 300 KM</p><div class="bar"><span style="background:#79e5b0;width:'+Math.min(100,Math.max(0,money()/3))+'%"></span></div>'+(role?'<form id="moneyform"><div class="field"><label>Opis</label><input id="note" required placeholder="Džeparac, poklon, dodatni posao..."></div><div class="field"><label>Iznos (KM)</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="row"><button type="submit" name="kind" value="add" class="primary">+ Dodaj</button><button type="submit" name="kind" value="spend">− Potrošnja</button></div></form>':'<p class="muted small">Promjene novca unosi roditelj.</p>')+'</div><h2>Promjene</h2>'+(state.transactions.length?state.transactions.slice().reverse().map(t=>'<div class="panel flex"><div><b>'+esc(t.note)+'</b><div class="small muted">'+esc(t.date)+'</div></div><b class="'+(t.amount>=0?'green':'danger')+'">'+(t.amount>0?'+':'')+t.amount.toFixed(2)+' KM</b></div>').join(''):'<p class="muted">Još nema promjena.</p>')}
function bind(){document.getElementById('prev')?.addEventListener('click',()=>{selected=addDays(selected,-1);render()});document.getElementById('next')?.addEventListener('click',()=>{selected=addDays(selected,1);render()});document.querySelectorAll('[data-daily]').forEach(el=>el.addEventListener('change',()=>{let i=+el.dataset.daily,a=state.daily[selected]||[];state.daily[selected]=el.checked?[...a,i]:a.filter(x=>x!==i);save()}));document.getElementById('hwform')?.addEventListener('submit',e=>{e.preventDefault();state.homework.push({id:Date.now(),subject:document.getElementById('subject').value,description:document.getElementById('description').value.trim(),due:document.getElementById('due').value,done:false});save()});document.querySelectorAll('[data-hw]').forEach(el=>el.addEventListener('change',()=>{let h=state.homework.find(x=>x.id===+el.dataset.hw);if(h)h.done=el.checked;save()}));document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{if(confirm('Obrisati ovu obavezu?')){state.homework=state.homework.filter(x=>x.id!==+el.dataset.delete);save()}}));document.querySelectorAll('[data-exam]').forEach(el=>el.addEventListener('change',()=>{let i=el.dataset.exam,j=+el.dataset.step,a=state.exam[i]||[];state.exam[i]=el.checked?[...a,j]:a.filter(x=>x!==j);save()}));document.getElementById('moneyform')?.addEventListener('submit',e=>{e.preventDefault();let v=+document.getElementById('amount').value,kind=e.submitter.value;if(!Number.isFinite(v)||v<=0)return;if(kind==='spend'&&v>money()){alert('Nema dovoljno novca.');return}state.transactions.push({amount:kind==='spend'?-v:v,note:document.getElementById('note').value.trim(),date:localDate(new Date())});save()})}document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;render()}));document.getElementById('role').addEventListener('click',()=>{role=!role;render()});render();
</script></body></html>
